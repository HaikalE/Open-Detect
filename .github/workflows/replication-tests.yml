name: Replication regression tests
on:
  push:
    branches: [codex/replication-fixes]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install pinned dependencies (CPU Torch build)
        run: |
          python -m pip install torch==2.1.1 torchvision==0.16.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Test numerical rules, checkpoint safety, and a synthetic training/evaluation cycle
        run: python -m unittest discover -s tests -v
